services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: puneeth
      POSTGRES_PASSWORD: hope3
      POSTGRES_DB: eazy_bill
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puneeth -d eazy_bill"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  test_db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: puneeth
      POSTGRES_PASSWORD: hope3
      POSTGRES_DB: test_db
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puneeth -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env.docker
        required: false
    environment:
      - APP_NAME
      - DEBUG
      - DATABASE_URL
      - TEST_DATABASE_URL
      - SECRET_KEY
      - ALGORITHM
      - ACCESS_TOKEN_EXPIRE_MINUTES
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      test_db:
        condition: service_healthy
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  test:
    build:
      context: .
      target: test
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://puneeth:hope3@db:5432/eazy_bill
      TEST_DATABASE_URL: postgresql+psycopg://puneeth:hope3@test_db:5432/test_db
      SECRET_KEY: dc10b21a55ba27ebc4cb6db3ec52ebf51791dd7b879fe3c7331c22d46992e6e1
      APP_NAME: EazyBill
      DEBUG: "False"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
    depends_on:
      test_db:
        condition: service_healthy

volumes:
  postgres_data:
  test_postgres_data:
