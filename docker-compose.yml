services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: puneeth
      POSTGRES_PASSWORD: hope3
      POSTGRES_DB: eazy_bill
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puneeth -d eazy_bill"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  test_db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: puneeth
      POSTGRES_PASSWORD: hope3
      POSTGRES_DB: test_db
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puneeth -d test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  test:
    build:
      context: .
      target: test
    env_file:
      - path: .env.docker
        required: false
    environment:
      - DATABASE_URL
      - TEST_DATABASE_URL
      - SECRET_KEY
      - APP_NAME
      - DEBUG
      - ALGORITHM
      - ACCESS_TOKEN_EXPIRE_MINUTES
    depends_on:
      test_db:
        condition: service_healthy

volumes:
  postgres_data:
  test_postgres_data:
